amcl:
  ros__parameters:
    use_sim_time: false

    # Frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    set_initial_pose: true
    initial_pose.x: 2.0
    initial_pose.y: 4.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

    # Topics
    scan_topic: /scan

    # Particle filter
    min_particles: 800
    max_particles: 2500
    kld_err: 0.05
    kld_z: 0.99

    # Motion model
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05

    # Sensor model
    laser_model_type: likelihood_field
    z_hit: 0.75
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.15
    sigma_hit: 0.1
    lambda_short: 0.1
    laser_likelihood_max_dist: 3.0

    # Update / resample
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1

    # TF
    tf_broadcast: true
    transform_tolerance: 0.2
